<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02010a"/>
      <stop offset="55%" stop-color="#0c0630"/>
      <stop offset="100%" stop-color="#1c0b3f"/>
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8f7bff"/>
      <stop offset="60%" stop-color="#4b2fb3"/>
      <stop offset="100%" stop-color="#180a3d"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- hex grid floor, subtle -->
  <g stroke="#5a3fc0" stroke-width="0.6" opacity="0.18">
    <path d="M0,230 L1000,230 M0,210 L1000,246 M0,246 L1000,210"/>
    <path d="M0,190 L1000,190"/>
  </g>

  <!-- scan line sweeping -->
  <rect x="0" y="0" width="1000" height="3" fill="#00e5ff" opacity="0.25">
    <animate attributeName="y" values="0;257;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- distant planet -->
  <circle cx="860" cy="70" r="75" fill="url(#planetGlow)"/>
  <circle cx="860" cy="70" r="42" fill="url(#planetBody)"/>
  <ellipse cx="860" cy="70" rx="62" ry="14" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.5" transform="rotate(-18 860 70)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="90" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="170" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="150" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="210" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="150" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="180" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="220" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M20,20 L20,45 M20,20 L45,20"/>
    <path d="M980,20 L980,45 M980,20 L955,20"/>
    <path d="M20,240 L20,215 M20,240 L45,240"/>
    <path d="M980,240 L980,215 M980,240 L955,240"/>
  </g>

  <!-- title -->
  <text x="500" y="118" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGrad)" letter-spacing="5" filter="url(#softGlow)">
    ANONYMOUS ROOM CHAT
  </text>
  <text x="500" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8fe9ff" letter-spacing="3">
    // NO IDENTITY · NO HISTORY · SAME PASSWORD = SAME ROOM
  </text>

  <!-- fleet insignia line -->
  <line x1="300" y1="165" x2="700" y2="165" stroke="#5a3fc0" stroke-width="1"/>
  <circle cx="500" cy="165" r="3" fill="#00e5ff"/>

  <!-- ship 1, lead -->
  <g>
    <g transform="scale(1.1) rotate(90)">
      <path d="M0,-12 L22,12 L0,5 L-22,12 Z" fill="url(#hull)"/>
      <circle cx="0" cy="0" r="3.2" fill="#fff"/>
      <path d="M-4,10 L0,26 L4,10 Z" fill="#00e5ff" opacity="0.6"/>
    </g>
    <animateMotion path="M -50,190 C 220,90 650,220 1060,90" dur="6.5s" rotate="auto" repeatCount="indefinite"/>
  </g>

  <!-- ship 2 -->
  <g opacity="0.85">
    <g transform="scale(0.75) rotate(90)">
      <path d="M0,-12 L22,12 L0,5 L-22,12 Z" fill="#00e5ff"/>
      <circle cx="0" cy="0" r="3" fill="#fff"/>
      <path d="M-3,10 L0,22 L3,10 Z" fill="#b388ff" opacity="0.6"/>
    </g>
    <animateMotion path="M -70,60 C 180,210 600,40 1060,180" dur="9s" begin="1.2s" rotate="auto" repeatCount="indefinite"/>
  </g>

  <!-- ship 3, distant -->
  <g opacity="0.5">
    <g transform="scale(0.4) rotate(90)">
      <path d="M0,-12 L22,12 L0,5 L-22,12 Z" fill="#ffffff"/>
    </g>
    <animateMotion path="M -40,230 C 280,170 520,230 1060,140" dur="11s" begin="3s" rotate="auto" repeatCount="indefinite"/>
  </g>
</svg>
